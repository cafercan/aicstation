<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- SessionStation mark: a rounded-square "station" with three stacked
       session bars and a live pulse. Original artwork; indigo to teal. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a3fb8"/>
      <stop offset="1" stop-color="#0e9c8f"/>
    </linearGradient>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#bg)"/>
  <rect x="232" y="300" width="560" height="96" rx="48" fill="#ffffff"/>
  <rect x="232" y="464" width="440" height="96" rx="48" fill="#ffffff" fill-opacity="0.85"/>
  <rect x="232" y="628" width="320" height="96" rx="48" fill="#ffffff" fill-opacity="0.7"/>
  <circle cx="744" cy="676" r="104" fill="none" stroke="#8af7dc" stroke-opacity="0.45" stroke-width="20"/>
  <circle cx="744" cy="676" r="62" fill="#8af7dc"/>
</svg>
