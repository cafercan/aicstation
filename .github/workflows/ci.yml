name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-audit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Pinned: a release build must not change with whatever "stable" is today.
      - name: Rust toolchain (rustup on the runner)
        shell: bash
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          rustup default 1.99.1
          rustc --version

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - run: npm ci
      - run: npm --prefix ui ci

      - run: cargo test --workspace
      - run: npm --prefix ui test
      - run: node --test scripts/gen-notices.test.mjs
      - run: node scripts/gen-notices.mjs --check

      - run: cargo install cargo-audit --locked --version 0.22.2
      - run: cargo audit
      - run: npm audit --audit-level=high
      - run: npm --prefix ui audit --audit-level=high

  # gitleaks-action cannot install gitleaks on Windows runners, so it runs on Linux.
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
