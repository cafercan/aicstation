name: release-linux

# Builds the Linux packages on the oldest supported Ubuntu, so they run on
# distros with an older glibc too, then the Arch package from the .deb in an
# Arch container. Run by hand: the packages are kept as a
# workflow artifact. When a release is published: they are also attached to
# it (its tag must be v<version> of tauri.conf.json). A pull request that
# changes the packaging builds them too, so a broken package shows up there.
on:
  workflow_dispatch:
  release:
    types: [published]
  pull_request:
    paths:
      - scripts/build-linux.sh
      - scripts/build-arch.sh
      - packaging/arch/**
      - scripts/butaglyph.json
      - scripts/fetch-butaglyph.mjs
      - src-tauri/tauri.conf.json
      - src-tauri/tauri.linux.conf.json
      - src-tauri/Cargo.toml
      - .github/workflows/release-linux.yml

permissions:
  contents: read

jobs:
  packages:
    runs-on: ubuntu-22.04
    permissions:
      contents: write # only used to attach the files to a published release
    env:
      # linuxdeploy is itself an AppImage; runners have no FUSE.
      APPIMAGE_EXTRACT_AND_RUN: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: System libraries (WebKitGTK, tray, D-Bus)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev libdbus-1-dev pkg-config file rpm

      - name: Rust toolchain (rustup on the runner)
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          rustup default 1.99.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - run: npm ci
      - run: npm --prefix ui ci

      - name: Release tag matches the app version
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="v$(node -p 'require("./src-tauri/tauri.conf.json").version')"
          [ "$TAG" = "$version" ] || { echo "tag $TAG != $version"; exit 1; }

      - run: cargo test --workspace
      - run: bash scripts/build-linux.sh

      - name: The packages ship butaglyph
        run: |
          dpkg-deb -c dist/*.deb | grep -E ' (\./)?usr/bin/buta$'
          rpm -qlp dist/*.rpm | grep -x /usr/bin/buta
          (cd "$RUNNER_TEMP" && "$GITHUB_WORKSPACE"/dist/*.AppImage --appimage-extract >/dev/null)
          "$RUNNER_TEMP"/squashfs-root/usr/bin/buta --version

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: AICStation-linux
          path: dist/
          if-no-files-found: error

      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber

  arch:
    needs: packages
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    permissions:
      contents: write # only used to attach the files to a published release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: The .deb of the packages job
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: AICStation-linux
          path: dist/

      # makepkg does not run as root.
      - name: Build the package
        run: |
          useradd -m builder
          chown -R builder: "$GITHUB_WORKSPACE"
          su builder -c "cd '$GITHUB_WORKSPACE' && bash scripts/build-arch.sh"

      - name: The package installs with its dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -U --noconfirm dist/AICStation-v*-linux-x86_64.pkg.tar.zst
          pacman -Qi aicstation-bin
          buta --version
          # Every library the app links to is there.
          if ldd /usr/bin/aicstation | grep 'not found'; then exit 1; fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: AICStation-arch
          path: |
            dist/*.pkg.tar.zst
            dist/PKGBUILD
            dist/SHA256SUMS-arch.txt
          if-no-files-found: error

      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          # The container has no git; --repo lets gh work without it.
          pacman -S --noconfirm --needed github-cli
          gh release upload "$TAG" dist/*.pkg.tar.zst dist/PKGBUILD dist/SHA256SUMS-arch.txt \
            --repo "$GITHUB_REPOSITORY" --clobber
