[package]
name = "claude-pano"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Claude Pano: yerel Claude Code oturumlarını izler"
default-run = "claude-pano"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
pano-core = { path = "../core" }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
