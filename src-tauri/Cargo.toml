[package]
name = "aicstation"
version = "1.6.0"
edition = "2021"
license = "MIT"
description = "AI C-Station: sessions, agents and terminals for Claude Code"
default-run = "aicstation"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
station-core = { path = "../core" }
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
notify = "6"
chrono = "0.4"
portable-pty = "0.9"
dirs = "7"

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "linux")'.dependencies]
tauri-plugin-single-instance = "2"
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_Security", "Win32_System_Registry", "Win32_System_SystemInformation"] }
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Threading", "Win32_System_Variant", "Win32_UI_Accessibility", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Data_Xml_Dom", "Foundation", "UI_Notifications"] }
